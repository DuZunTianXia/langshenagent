# An artifact another job of this run uploads, downloaded once it is there:
# for a job that starts before that one ends (it needs the artifact only
# late), rather than waiting for it with `needs`. Given that job's name, it
# stops as soon as the job ends without it (failed, or cancelled: a macOS
# runner may never come), as `needs` would. The workflow has to let its
# token read actions (permissions: actions: read).
name: Wait for an artifact
description: Waits for an artifact of this run, then downloads it
inputs:
  name:
    description: The artifact
    required: true
  path:
    description: Where it goes
    required: true
  job:
    description: The name of the job that uploads it, as the run lists it
    default: ''
  minutes:
    description: How long to wait for it
    default: '20'
runs:
  using: composite
  steps:
    # PowerShell: on GitHub's Windows runners, and reads JSON (jq may not
    # be on Arm Windows). Everywhere else the same in bash, with curl and
    # jq: a self-hosted macOS runner need not have pwsh installed.
    - name: Wait for ${{ inputs.name }}
      if: runner.os != 'Windows'
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        JOB: ${{ inputs.job }}
        MINUTES: ${{ inputs.minutes }}
      run: |
        run="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        ask() {
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' "$run/$1"
        }
        deadline=$(( $(date +%s) + MINUTES * 60 ))
        while true; do
          if artifacts=$(ask "artifacts?name=$NAME"); then
            if [ "$(jq .total_count <<< "$artifacts")" -gt 0 ]; then
              echo "$NAME is there"
              break
            fi
            # This attempt's jobs: a run again makes the job again.
            if [ -n "$JOB" ] && jobs=$(ask 'jobs?filter=latest&per_page=100'); then
              ended=$(jq -r --arg job "$JOB" '[.jobs[] | select(.name == $job)][0]
                | select(.status == "completed" and .conclusion != "success")
                | .conclusion' <<< "$jobs")
              if [ -n "$ended" ]; then
                echo "::error::$JOB ended ($ended) without uploading $NAME"
                exit 1
              fi
            fi
          else
            echo "Asking GitHub failed, asking again"
          fi
          if [ "$(date +%s)" -gt "$deadline" ]; then
            echo "::error::$NAME was not uploaded within $MINUTES minutes"
            exit 1
          fi
          sleep 10
        done
    # Downloaded with curl rather than actions/download-artifact: the
    # artifacts API lists one its upload has only just finished before
    # it can be downloaded, and the action's "Artifact not found" then
    # fails the job for good (2026-11-24, the Linux x64 build 500ms after
    # "remote is there"). Tried again until it answers, as the wait did.
    - name: Download ${{ inputs.name }}
      if: runner.os != 'Windows'
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        PATH_OUT: ${{ inputs.path }}
        MINUTES: ${{ inputs.minutes }}
      run: |
        run="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        deadline=$(( $(date +%s) + MINUTES * 60 ))
        mkdir -p "$PATH_OUT"
        while true; do
          url=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' "$run/artifacts?name=$NAME" \
            | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -n "$url" ] && curl -fsSL -o "$RUNNER_TEMP/artifact.zip" \
            -H "Authorization: Bearer $TOKEN" "$url"; then
            unzip -q -o "$RUNNER_TEMP/artifact.zip" -d "$PATH_OUT"
            rm -f "$RUNNER_TEMP/artifact.zip"
            echo "$NAME downloaded"
            break
          fi
          if [ "$(date +%s)" -gt "$deadline" ]; then
            echo "::error::$NAME could not be downloaded within $MINUTES minutes"
            exit 1
          fi
          sleep 5
        done
    - name: Wait for ${{ inputs.name }}
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        JOB: ${{ inputs.job }}
        MINUTES: ${{ inputs.minutes }}
      run: |
        $headers = @{ Authorization = "Bearer $env:TOKEN"; Accept = 'application/vnd.github+json' }
        $run = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
        $deadline = (Get-Date).AddMinutes([int]$env:MINUTES)
        while ($true) {
          try {
            $artifacts = Invoke-RestMethod "$run/artifacts?name=$env:NAME" -Headers $headers
            if ($artifacts.total_count -gt 0) { Write-Output "$env:NAME is there"; break }
            if ($env:JOB) {
              # This attempt's jobs: a run again makes the job again.
              $jobs = (Invoke-RestMethod "$run/jobs?filter=latest&per_page=100" -Headers $headers).jobs
              $job = $jobs | Where-Object { $_.name -eq $env:JOB } | Select-Object -First 1
              if ($job -and $job.status -eq 'completed' -and $job.conclusion -ne 'success') {
                Write-Output "::error::$env:JOB ended ($($job.conclusion)) without uploading $env:NAME"
                exit 1
              }
            }
          } catch {
            Write-Output "Asking GitHub failed, asking again: $_"
          }
          if ((Get-Date) -gt $deadline) {
            Write-Output "::error::$env:NAME was not uploaded within $env:MINUTES minutes"
            exit 1
          }
          Start-Sleep -Seconds 10
        }
    # Downloaded with the API directly rather than actions/download-artifact:
    # the artifacts API lists one its upload has only just finished before
    # it can be downloaded, and the action's "Artifact not found" then
    # fails the job for good.
    - name: Download ${{ inputs.name }}
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        PATH_OUT: ${{ inputs.path }}
        MINUTES: ${{ inputs.minutes }}
      run: |
        $headers = @{ Authorization = "Bearer $env:TOKEN"; Accept = 'application/vnd.github+json' }
        $run = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
        $deadline = (Get-Date).AddMinutes([int]$env:MINUTES)
        New-Item -ItemType Directory -Force -Path $env:PATH_OUT | Out-Null
        $zip = Join-Path $env:RUNNER_TEMP 'artifact.zip'
        while ($true) {
          try {
            $artifacts = Invoke-RestMethod "$run/artifacts?name=$env:NAME" -Headers $headers
            $url = $artifacts.artifacts[0].archive_download_url
            if ($url) {
              try {
                Invoke-WebRequest $url -Headers @{ Authorization = "Bearer $env:TOKEN" } -OutFile $zip
                Expand-Archive -Force $zip $env:PATH_OUT
                Remove-Item $zip -ErrorAction SilentlyContinue
                Write-Output "$env:NAME downloaded"
                break
              } catch {
                Write-Output "Download not ready yet: $_"
              }
            }
          } catch {
            Write-Output "Asking GitHub failed, asking again: $_"
          }
          if ((Get-Date) -gt $deadline) {
            Write-Output "::error::$env:NAME could not be downloaded within $env:MINUTES minutes"
            exit 1
          }
          Start-Sleep -Seconds 5
        }
